[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilostat-mcp"
version = "0.1.0"
description = "MCP server exposing ILOSTAT employment and wage data to AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "sdmx1>=2.0",
    "cloudscraper>=1.2",
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
ilostat-mcp = "ilostat_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ilostat_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]
