[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilostat-mcp"
version = "0.1.0"
description = "MCP server exposing ILOSTAT employment and wage data to AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "sdmx1>=2.0",
    "cloudscraper>=1.2",
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
ilostat-mcp = "ilostat_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ilostat_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
# Only lint production source and tests; exclude scratch scripts and config dirs.
exclude = ["local-notes/", ".claude/"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PERF",   # perflint
    "RUF",    # ruff-specific
]
ignore = [
    "SIM105", # contextlib.suppress — try/except is clearer here
    "RUF002", # ambiguous unicode chars in docstrings — intentional punctuation
    "SIM300", # "yoda conditions" — set(a) >= b is subjective style
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party libraries with no type stubs; ignore their imports.
module = ["cloudscraper", "sdmx", "sdmx.message"]
ignore_missing_imports = true
